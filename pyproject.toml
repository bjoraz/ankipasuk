[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankipasuk"
dynamic = ["version"]
description = "Anki cards for qeriya: nested clozes split along the ta'amim, optional tiqqun cards for memorizing the Tora as laid out in the sefer, and the text's shorashim and recurring phrases."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexis Fonjallaz" }]
keywords = ["anki", "tora", "hebrew", "ta'amim", "cantillation", "sefaria"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.31",
    "pywebview>=5.0",
]

[project.optional-dependencies]
# pywebview drives the OS's own web engine rather than bundling one. On
# Windows (WebView2) and macOS (WKWebView) it pulls in everything it needs
# on its own. On Linux it needs either PyGObject/WebKitGTK -- system
# packages, see the README -- or Qt WebEngine, which this extra installs
# for a pip-only setup that needs no root. See ankipasuk.webgui.backend.
qt = [
    "pywebview[qt]>=5.0",
]
# PDF export of 'ammud pages (see ankipasuk.ammud_pages). WeasyPrint draws
# text with Pango, which Linux desktops have; on Windows it needs a GTK
# runtime. HTML export needs nothing extra.
pdf = [
    "weasyprint>=60",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]
# The browser tests of the app's pages (tests/test_frontend), which also
# need a Chromium: python -m playwright install chromium.
ui-test = [
    "playwright>=1.40",
]

[project.scripts]
ankipasuk = "ankipasuk.webgui:main"
ankipasuk-check-connection = "ankipasuk.anki_connect.cli:_console_check_connection"
ankipasuk-init-stems = "ankipasuk.anki_connect.cli:_console_init_stems"
ankipasuk-sync-scheduling = "ankipasuk.anki_connect.cli:_console_sync_scheduling"
ankipasuk-tag-deck = "ankipasuk.anki_connect.cli:_console_tag_deck"
ankipasuk-migrate-tags = "ankipasuk.anki_connect.cli:_console_migrate_tags"

[project.urls]
Homepage = "https://github.com/bjoraz/ankipasuk"

[tool.setuptools.dynamic]
version = { attr = "ankipasuk.__version__" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ankipasuk.data" = ["*.json", "*.json.gz", "shorashim/*.json.gz", "phrases/*.json.gz", "semantics/*.json.gz"]
"ankipasuk.webgui" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
