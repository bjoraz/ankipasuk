[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankipasuk"
version = "0.1.0"
description = "Generate nested Anki cloze cards from Torah cantillation (trope) structure, with a corpus-statistics viewer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexis Fonjallaz" }]
keywords = ["anki", "torah", "hebrew", "trope", "cantillation", "sefaria"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.31",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ankipasuk = "ankipasuk.gui.app:main"
ankipasuk-check-connection = "ankipasuk.anki_connect.cli:_console_check_connection"
ankipasuk-init-stems = "ankipasuk.anki_connect.cli:_console_init_stems"
ankipasuk-sync-scheduling = "ankipasuk.anki_connect.cli:_console_sync_scheduling"

[project.urls]
Homepage = "https://github.com/bjoraz/ankipasuk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
