[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ankipasuk"
version = "0.1.0"
description = "Generate nested Anki cloze cards from Torah cantillation (trope) structure, with a corpus-statistics viewer."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Alexis Fonjallaz" }]
keywords = ["anki", "torah", "hebrew", "trope", "cantillation", "sefaria"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Intended Audience :: Education",
    "Topic :: Education",
]
dependencies = [
    "requests>=2.31",
    # <5.3 deliberately: 5.3 introduced window.native (reflecting the
    # native WinForms/WebView2 window object for JS access), which this
    # app never uses but which has caused a reproducible ~10s startup
    # freeze on at least one Windows machine (repeated "[pywebview] Error
    # while processing window.native.X" log spam -- recursion depth
    # exceeded walking circular WinForms Accessibility/COM properties,
    # plus "members can only be accessed from the UI thread" errors).
    # Revisit this pin if a pywebview release fixes that reflection or
    # adds a way to disable it.
    "pywebview>=5.0,<5.3",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.5",
]

[project.scripts]
ankipasuk = "ankipasuk.webgui:main"
ankipasuk-tk-legacy = "ankipasuk.gui.app:main"
ankipasuk-check-connection = "ankipasuk.anki_connect.cli:_console_check_connection"
ankipasuk-init-stems = "ankipasuk.anki_connect.cli:_console_init_stems"
ankipasuk-sync-scheduling = "ankipasuk.anki_connect.cli:_console_sync_scheduling"
ankipasuk-tag-deck = "ankipasuk.anki_connect.cli:_console_tag_deck"

[project.urls]
Homepage = "https://github.com/bjoraz/ankipasuk"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ankipasuk.data" = ["*.json"]
"ankipasuk.webgui" = ["static/*.html", "static/*.css", "static/*.js"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
